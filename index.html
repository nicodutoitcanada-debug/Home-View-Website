<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home View Solutions</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
}

/* Background Video */
#bgVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
}

/* Black fade layer */
.video-fade{
    position:fixed;
    inset:0;
    background:#000;
    z-index:2;
    pointer-events:none;
    animation:fadeAway 0.75s ease forwards;
}

/* Dark overlay */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.30);
    z-index:3;
    pointer-events:none;
}

/* Center Content */
.center-wrap{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
    z-index:10;
}

/* Lottie Container */
#lottie{
    width:640px;
    max-width:90vw;

    opacity:0;
    transform:scale(0.95);

    animation:contentReveal 0.75s ease 0.4s forwards;
}

/* Button Wrapper */
#buttonWrapper{
    opacity:0;
    transform:scale(0.95);

    animation:contentReveal 0.75s ease 0.4s forwards;
}

/* EXIT animation (fix for reliable shrink + fade) */
#buttonWrapper.hide{
    pointer-events:none;
    animation:buttonExit 0.5s ease forwards;
}

/* ENTER SITE Button */
.enter-btn{
    position:relative;
    padding:14px 38px;
    border:none;
    border-radius:999px;
    background:rgba(255,255,255,0.35);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    cursor:pointer;
    overflow:hidden;
}

/* Button Text */
.enter-btn span{
    color:rgba(0,0,0,0.9);
    font-weight:700;
    letter-spacing:3px;
    font-size:14px;
    mix-blend-mode:multiply;
}

/* Video fade out layer */
.video-fade{
    position:fixed;
    inset:0;
    background:#000;
    z-index:2;
    pointer-events:none;
    animation:fadeAway 0.75s ease forwards;
}

/* Fade black away to reveal video */
@keyframes fadeAway{
    from{ opacity:1; }
    to{ opacity:0; }
}

/* Logo + button reveal */
@keyframes contentReveal{
    from{
        opacity:0;
        transform:scale(0.95);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Button exit animation */
@keyframes buttonExit{
    from{
        opacity:1;
        transform:scale(1);
    }
    to{
        opacity:0;
        transform:scale(0.85);
    }
}
</style>
</head>

<body>

<video id="bgVideo" autoplay muted loop playsinline>
    <source src="blue fog.mp4" type="video/mp4">
</video>

<div class="video-fade"></div>
<div class="overlay"></div>

<div class="center-wrap">

    <div id="lottie"></div>

    <div id="buttonWrapper">
        <button class="enter-btn" id="enterBtn">
            <span>ENTER SITE</span>
        </button>
    </div>

</div>

<script>

const animation = lottie.loadAnimation({
    container: document.getElementById('lottie'),
    renderer: 'svg',
    loop: false,
    autoplay: false,
    path: 'logo merge.json'
});

/* Freeze on first frame */
animation.addEventListener('DOMLoaded', () => {
    animation.goToAndStop(0, true);
});

/* Click handler */
document.getElementById('enterBtn').addEventListener('click', () => {

    const wrapper = document.getElementById('buttonWrapper');

    wrapper.classList.add('hide');

    animation.play();

});

</script>

</body>
</html>
