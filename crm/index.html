<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a2a"><link rel="manifest" href="crm.webmanifest"><link rel="apple-touch-icon" href="crm-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Home View CRM"><meta name="description" content="Home View Solutions — private sales CRM for builder relationships, contacts and follow-ups">
<title>Home View CRM | Sales Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<div class="mobile-head"><button type="button" class="menu-button" id="mobileMenu" aria-label="Open navigation">☰</button><img class="mobile-brand-logo" src="logo_2.png" alt="Home View Solutions"><span class="mobile-label">CRM</span></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><img class="brand-logo" src="logo_2.png" alt="Home View Solutions"><div class="brand-sub">SALES CRM</div></div>
  <div class="sidebar-label">Workspace</div>
  <nav class="nav" aria-label="Main navigation">
    <button type="button" class="nav-btn active" data-nav="dashboard"><span class="nav-icon">▦</span> Dashboard</button>
    <button type="button" class="nav-btn" data-nav="companies"><span class="nav-icon">▤</span> Companies</button>
    <button type="button" class="nav-btn" data-nav="pipeline"><span class="nav-icon">◫</span> Sales pipeline</button>
    <button type="button" class="nav-btn" data-nav="tasks"><span class="nav-icon">☑</span> Follow-ups & tasks</button>
  </nav>
  <div class="sidebar-label" style="margin-top:17px">Management</div>
  <nav class="nav"><button type="button" class="nav-btn" data-nav="settings"><span class="nav-icon">⚙</span> Team & settings</button></nav>
  <div class="sidebar-bottom"><div class="profile"><div class="avatar" id="userAvatar">HV</div><div><div class="profile-name" id="userName">Preview workspace</div><div class="profile-caption" id="userRole">Home View Solutions</div></div></div><button class="logout hidden" id="logoutBtn" type="button">Sign out →</button></div>
</aside>
<main class="workspace">
  <div class="topbar"><div class="heading"><div class="eyebrow">HOME VIEW SOLUTIONS / SALES HUB</div><h1 id="pageTitle">Dashboard</h1><div class="subheading" id="pageSubtitle">Keep every builder conversation moving.</div></div><button type="button" class="primary-btn" id="primaryAction">+ Add company</button></div>
  <div id="notice"></div>
  <div id="view" aria-live="polite"></div>
</main></div>
<div class="modal-backdrop hidden" id="modalBackdrop" role="presentation"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-heading"><div><div class="eyebrow">HOME VIEW CRM</div><div class="modal-title" id="modalTitle"></div></div><button type="button" class="close-btn" aria-label="Close dialog" id="closeModal">×</button></div><form id="modalForm"></form></div></div>
<div class="auth-layer hidden" id="authLayer"><div class="auth-card"><div class="auth-logo"><img class="auth-brand-logo" src="logo_2.png" alt="Home View Solutions"><span>SALES CRM</span></div><div id="authBody"></div></div></div>
<div role="status" class="toast hidden" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js" defer></script>
</body></html>
